name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  calidad:
    name: Lint, formato y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formato)
        run: ruff format --check .
      - name: mypy
        run: mypy

  tests:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    needs: calidad
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Validar reglas
        run: detectionlab validate
      - name: Tests con cobertura
        run: pytest --cov --cov-report=term-missing --junitxml=resultados.xml
      - name: Evaluar todas las muestras
        run: detectionlab run samples --solo-disparos
      - name: Generar el informe
        run: detectionlab report --junit resultados.xml --salida site
      - name: Guardar el sitio generado
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: site/
