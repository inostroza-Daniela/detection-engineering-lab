[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detectionlab"
dynamic = ["version"]
description = "Laboratorio de ingeniería de detección: reglas Sigma para Linux, motor de evaluación y cobertura ATT&CK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Daniela Inostroza" }]
keywords = ["sigma", "detection-engineering", "mitre-attack", "wazuh", "blue-team"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["pysigma>=2.0,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.17,<0.18",
  "mypy>=2.3,<3",
  "pre-commit>=3.8",
]

[project.scripts]
detectionlab = "detectionlab.cli:main"

[project.urls]
Repositorio = "https://github.com/inostroza-Daniela/detection-engineering-lab"
Sitio = "https://inostroza-daniela.github.io/detection-engineering-lab/"

[tool.setuptools.dynamic]
version = { attr = "detectionlab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detectionlab = ["recursos/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "N", "PTH", "PLC", "PLE", "PLW"]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC1901"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["sigma.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.coverage.run]
source = ["detectionlab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
